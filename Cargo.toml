[package]
name = "eventkit-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.19"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "io-util"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
plist = "1.10.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
